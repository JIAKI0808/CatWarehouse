<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatWareHouse · 移动端 UI 优化对比</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #12212b;
        --muted: #60717d;
        --cyan: #19c4d4;
        --line: rgba(100, 128, 145, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        color: var(--ink);
        background:
          radial-gradient(circle at 5% 12%, rgba(77, 220, 232, 0.25), transparent 28%),
          radial-gradient(circle at 92% 18%, rgba(184, 255, 224, 0.38), transparent 30%),
          linear-gradient(145deg, #effafa 0%, #f9fbfc 48%, #eaf6f3 100%);
        font-family: Inter, Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .showcase {
        width: max-content;
        min-width: 100%;
        padding: 34px clamp(24px, 4vw, 70px) 56px;
      }
      .intro {
        width: min(980px, calc(100vw - 48px));
        margin: 0 auto 28px;
        text-align: center;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: #0d8997;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--cyan); }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.18; letter-spacing: -.035em; }
      .intro p { max-width: 670px; margin: 12px auto 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
      .compare-grid {
        display: grid;
        grid-template-columns: repeat(2, 425px);
        justify-content: center;
        gap: 44px;
      }
      .version { min-width: 0; }
      .version-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        width: 375px;
        margin: 0 auto 12px;
      }
      .version-label { display: flex; align-items: center; gap: 9px; }
      .index {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: #25343d;
        font-size: 12px;
        font-weight: 800;
      }
      .after .index { background: var(--cyan); }
      .version h2 { margin: 0; font-size: 16px; }
      .version-head small { color: var(--muted); font-size: 11px; }
      .reset {
        min-width: 44px;
        min-height: 44px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        background: rgba(255,255,255,.58);
        cursor: pointer;
      }
      .reset:hover { color: var(--ink); background: #fff; }
      .device {
        width: 377px;
        height: 814px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.9);
        border-radius: 33px;
        background: #fff;
        box-shadow: 0 28px 64px rgba(50, 75, 87, .2);
      }
      iframe { width: 375px; height: 812px; display: block; border: 0; background: #fff; }
      .caption {
        width: 375px;
        min-height: 52px;
        margin: 15px auto 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--muted);
        background: rgba(255,255,255,.55);
        font-size: 12px;
        line-height: 1.55;
      }
      .caption b { color: var(--ink); }
      @media (max-width: 920px) { .showcase { padding-inline: 20px; } }
    </style>
  </head>
  <body>
    <main class="showcase">
      <header class="intro">
        <div class="eyebrow">CatWareHouse · Mobile Redesign</div>
        <h1>直接 Vibe Coding 优化界面</h1>
        <p>将需求描述给codex，生成初版界面，再使用codex对页面进行进一步的优化</p>
      </header>

      <section class="compare-grid" aria-label="移动端优化前后对比">
        <article class="version before">
          <div class="version-head">
            <div class="version-label"><span class="index">01</span><div><h2>优化前</h2><small>原始 Vant 功能结构</small></div></div>
            <button class="reset" type="button" data-reset="before-frame">重置</button>
          </div>
          <div class="device"><iframe id="before-frame" src="before.html" title="CatWareHouse 移动端优化前演示"></iframe></div>
          <p class="caption"><b>功能优先：</b>操作入口分散、固定新增按钮遮挡内容，信息层级较弱，设置项偏长。</p>
        </article>

        <article class="version after">
          <div class="version-head">
            <div class="version-label"><span class="index">02</span><div><h2>优化后</h2><small>当前视觉与交互方案</small></div></div>
            <button class="reset" type="button" data-reset="after-frame">重置</button>
          </div>
          <div class="device"><iframe id="after-frame" src="after.html" title="CatWareHouse 移动端优化后演示"></iframe></div>
          <p class="caption"><b>体验升级：</b>搜索前置、快捷任务聚合、概况按需展开，并以品牌化组件统一页面节奏。</p>
        </article>
      </section>
    </main>
    <script>
      document.querySelectorAll("[data-reset]").forEach((button) => {
        button.addEventListener("click", () => {
          const frame = document.getElementById(button.dataset.reset);
          frame.src = frame.src;
        });
      });
    </script>
  </body>
</html>
